[workspace]
resolver = "3"
members = ["chonk-core", "chonk-app"]

[workspace.dependencies]
tiny-skia = "0.12"
resvg = "0.49"
usvg = "0.49"
fontdb = "0.24"
cosmic-text = "0.19"
swash = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "qoi", "bmp", "tiff"] }
imageproc = "0.25"

[profile.release]
lto = "thin"
